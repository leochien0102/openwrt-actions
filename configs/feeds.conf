# 同名包按声明顺序选择；整个 feed 的优先级：aetherproxy > luciextras > helloworld > 上游。
# aether-proxy（依赖 firewall4，包在 common.config 里选）。chinadns-ng 使用此 feed 的固定二进制。
# 用 ^提交号而不是 ;标签：scripts/feeds 对已有检出执行 git pull，游离 HEAD 会失败。
# 当前 v1.1.2-r1；发布后同步完整提交号（git rev-parse v<版本>^{commit}）。
src-git aetherproxy https://github.com/leochien0102/aether-proxy.git^7234b4dcfeb4df5bd4f23c5f8ea797b082304d1f
# aether-dns：DNS 引擎的默认提供者（1.0.0 起）。包在 openwrt/ 子目录；二进制由
# scripts/lib.sh 的 stage_aether_dns 从已发布 ipk 取出后落到 feed 检出（pins/aetherdns.env）。
src-git aetherdns https://github.com/leochien0102/aether-dns.git^7402e59b5254c42a94540db76a8332dfaee8ee2d
src-git luciextras https://github.com/leochien0102/luci-extras.git;main
# helloworld 提供 xray-core（含扩展协议补丁）；ssr-plus 按 PACKAGE_firewall4 选 nftables。
src-git helloworld https://github.com/leochien0102/helloworld.git;dev-main
