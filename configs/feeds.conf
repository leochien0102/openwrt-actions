# aether-proxy 的发布仓库，取其中的 xray-core 与 chinadns-ng（scripts/lib.sh 的 install_feeds 指定来源）：
# xray-core 与设备上的通道更新同一份构建（固定官方 Go 工具链、golden 配置闸门），版本号写法一致；
# chinadns-ng 是按 sha256 固定的上游静态二进制，通道不自动更新它，版本由固件决定。钉在提交上，理由同 aetherproxy。
