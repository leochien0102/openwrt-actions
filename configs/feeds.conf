# aether-proxy（自建透明代理，替代 ssr-plus）。只有 fw4 能用（依赖 firewall4），包在 fw4.config 里选。
# 钉在发布提交上（^提交号）而不是 ;标签：scripts/feeds 对已有检出执行 git pull --ff-only，
# 标签检出是游离 HEAD，pull 会失败；^提交号的检出不再更新，改号时整份重新克隆。
# 当前：v0.3.1-r1。升级时换成新标签对应的完整提交号（git rev-parse v<版本>^{commit}）。
