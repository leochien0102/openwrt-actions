name: Build x86

on:
  schedule:
    - cron: '0 16 * * 0'  # UTC 16:00 Sunday = Beijing 00:00 Monday
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  # 统一编译 fw3（iptables）版本。fw4 已在本地 H28K 验证通过，
  # 稳定运行一段时间后把这里改成 '4' 即可整体切换。
  FW: '3'

jobs:
  build:
    name: Build x86
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore dl cache
        uses: actions/cache@v4
        with:
          path: shared/dl
          key: dl-x86-fw${{ env.FW }}-${{ hashFiles('configs/x86.config', format('configs/fw{0}.config', env.FW), format('configs/feeds.fw{0}.conf', env.FW)) }}
          restore-keys: dl-x86-

      - name: Restore feeds cache
        uses: actions/cache@v4
        with:
          path: shared/feeds
          key: feeds-x86-fw${{ env.FW }}-${{ hashFiles(format('configs/feeds.fw{0}.conf', env.FW)) }}
          restore-keys: feeds-x86-fw${{ env.FW }}-


      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib gettext \
            genisoimage git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev \
            libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev \
            libreadline-dev libssl-dev libtool llvm lrzsz libnsl-dev ninja-build p7zip p7zip-full patch pkgconf \
            python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion \
            swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev

      - name: Clone lede source
        run: git clone --depth=1 https://github.com/coolsnowwolf/lede lede-src

      - name: Init shared directories
        run: mkdir -p shared/dl shared/feeds

      - name: Build
        run: bash scripts/build-x86.sh -fw ${{ env.FW }}

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-x86
          path: output/x86/firmware/
          retention-days: 1

  release:
    name: Release
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: write
    steps:
      - name: Set release tag
        id: tag
        run: echo "tag=x86-$(TZ=Asia/Shanghai date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Download firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware-x86
          path: release/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body: |
            x86 weekly build — ${{ steps.tag.outputs.tag }}

            | Target | Status |
            |--------|--------|
            | x86_64 (qcow2) | ✅ |
          files: release/*

      - name: Cleanup old releases (keep 4)
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: 4
          delete_tags: true
          delete_tag_pattern: x86-
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}