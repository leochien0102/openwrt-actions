name: Build Rockchip

on:
  schedule:
    - cron: '0 16 * * 0'  # UTC 16:00 Sunday = Beijing 00:00 Monday
  workflow_dispatch:
    inputs:
      fw:
        description: 编译哪个防火墙世代
        type: choice
        default: all
        options:
          - all
          - '3'
          - '4'

env:
  TZ: Asia/Shanghai

jobs:
  build:
    name: Build Rockchip (fw${{ matrix.fw }})
    runs-on: ubuntu-24.04
    strategy:
      # 一个世代编不过不该连累另一个，两边的失败一次看全。
      fail-fast: false
      matrix:
        # 定时触发时 inputs 为空，两个世代都编；手动触发可只挑一个。
        fw: ${{ fromJSON(inputs.fw == '3' && '["3"]' || inputs.fw == '4' && '["4"]' || '["3","4"]') }}
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore dl cache
        uses: actions/cache@v4
        with:
          path: shared/dl
          key: dl-rockchip-fw${{ matrix.fw }}-${{ hashFiles('configs/rockchip.config', format('configs/fw{0}.config', matrix.fw), 'configs/feeds.conf') }}
          restore-keys: dl-rockchip-

      - name: Restore feeds cache
        uses: actions/cache@v4
        with:
          path: shared/feeds
          # feeds 不再分世代：configs/feeds.conf 两个世代共用，所以两条 matrix
          # 腿共享同一份缓存。并发保存时其中一条会因键已存在而跳过，无害。
          key: feeds-rockchip-${{ hashFiles('configs/feeds.conf') }}
          restore-keys: feeds-rockchip-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib gettext \
            genisoimage git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev \
            libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev \
            libreadline-dev libssl-dev libtool llvm lrzsz libnsl-dev ninja-build p7zip p7zip-full patch pkgconf \
            python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion \
            swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev

      - name: Clone lede source
        run: git clone --depth=1 https://github.com/coolsnowwolf/lede lede-src

      - name: Init shared directories
        run: mkdir -p shared/dl shared/feeds

      - name: Build
        run: bash scripts/build-rockchip.sh -fw ${{ matrix.fw }}

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-rockchip-fw${{ matrix.fw }}
          path: output/rockchip/firmware/
          retention-days: 1

  release:
    name: Release
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: write
    steps:
      - name: Set release tag
        id: tag
        run: echo "tag=rockchip-$(TZ=Asia/Shanghai date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Download firmware
        uses: actions/download-artifact@v4
        with:
          # 一次 release 收齐这次跑出来的所有世代。合并到同一目录是安全的：
          # collect_output 已经把 fw<N> 写进文件名，不会撞名。
          pattern: firmware-rockchip-fw*
          path: release/
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body: |
            Rockchip weekly build — ${{ steps.tag.outputs.tag }}

            目标：Rockchip H28K

            文件名里的 `fw3` / `fw4` 标出防火墙世代：
            `fw3` = iptables + fw3，`fw4` = nftables + firewall4。
            两者由同一份源码构建，差异只在 `configs/fw3.config` 与 `fw4.config`。
          files: release/*

      - name: Cleanup old releases (keep 4)
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: 4
          delete_tags: true
          delete_tag_pattern: rockchip-
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
